name: Android APK Derle

on:
  push:
    branches: [main]
    paths-ignore:
      - "onizleme/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot (C#) ve Android şablonları
        run: |
          V=4.3-stable
          curl -sSL https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_mono_linux_x86_64.zip -o g.zip
          unzip -q g.zip -d $HOME/godot && rm g.zip
          sudo ln -sf $HOME/godot/Godot_v${V}_mono_linux_x86_64/Godot_v${V}_mono_linux.x86_64 /usr/local/bin/godot
          curl -sSL https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_mono_export_templates.tpz -o t.tpz
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable.mono
          unzip -q -j t.tpz "templates/android*" "templates/version.txt" -d $HOME/.local/share/godot/export_templates/4.3.stable.mono && rm t.tpz
          ls $HOME/.local/share/godot/export_templates/4.3.stable.mono
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p $HOME/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > $HOME/.config/godot/editor_settings-4.3.tres
          cat $HOME/.config/godot/editor_settings-4.3.tres

      - name: Derle
        run: |
          mkdir -p build/android
          godot --headless --editor --quit > /dev/null 2>&1 || true
          godot --headless --export-debug "Android" build/android/KuleSavunma.apk > build/disa_aktar.txt 2>&1 || true
          tail -60 build/disa_aktar.txt
          ls -la build/android
          test -f build/android/KuleSavunma.apk

      - name: Hata kaydını depoya yaz
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          mkdir -p onizleme
          tail -150 build/disa_aktar.txt > onizleme/android.txt 2>&1 || echo "kayıt yok" > onizleme/android.txt
          git add onizleme/android.txt
          git commit -m "Android derleme kaydı" || true
          git pull --rebase -q || true
          git push || true

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: KuleSavunma-APK
          path: build/android/KuleSavunma.apk

      - name: Telefona kolay indirme için yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: Kule Savunma (son sürüm)
          body: Telefona indirip kurmak için aşağıdaki KuleSavunma.apk dosyasına dokun.
          make_latest: true
          files: build/android/KuleSavunma.apk
