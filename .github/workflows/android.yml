name: Android APK Derle

on:
  push:
    branches: [main]
    paths-ignore:
      - "onizleme/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:mono-4.3
    steps:
      - uses: actions/checkout@v4

      - name: Derle
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          export HOME=/root
          dotnet --version || true
          ls /root/.local/share/godot/export_templates/ || true
          ls /root/.config/godot/ || true
          mkdir -p build/android
          godot --headless --editor --quit > /dev/null 2>&1 || true
          godot --headless --export-debug "Android" build/android/KuleSavunma.apk > build/disa_aktar.txt 2>&1 || true
          tail -80 build/disa_aktar.txt
          ls -la build/android
          test -f build/android/KuleSavunma.apk

      - name: Hata kaydını depoya yaz
        if: failure()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          mkdir -p onizleme
          { dotnet --info 2>&1 | head -20; ls -R /root/.local/share/godot/export_templates 2>&1 | head; cat build/disa_aktar.txt 2>&1 | tail -150; } > onizleme/android.txt
          git add onizleme/android.txt
          git commit -m "Android derleme kaydı" || true
          git pull --rebase -q || true
          git push || true

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: KuleSavunma-APK
          path: build/android/KuleSavunma.apk

      - name: Telefona kolay indirme için yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: Kule Savunma (son sürüm)
          body: Telefona indirip kurmak için aşağıdaki KuleSavunma.apk dosyasına dokun.
          make_latest: true
          files: build/android/KuleSavunma.apk
