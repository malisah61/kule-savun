name: Denge Botu

on:
  workflow_dispatch:
    inputs:
      son:
        description: "Botun gideceği son bölüm"
        default: "60"

permissions:
  contents: write

concurrency:
  group: denge
  cancel-in-progress: true

jobs:
  oyna:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Godot (C#) ve sanal ekran
        run: |
          curl -sSL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip -o g.zip
          unzip -q g.zip -d /opt && rm g.zip
          ln -s /opt/Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64 /usr/local/bin/godot || sudo ln -s /opt/Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libxi6 libxrandr2 libxcursor1 libxinerama1 > /dev/null

      - name: İçe aktar ve C# derle
        run: |
          mkdir -p onizleme
          godot --headless --path . --editor --quit > /dev/null 2>&1 || true
          dotnet build KuleSavun.csproj 2>&1 | tee onizleme/derleme.txt | tail -30
          grep -q "Build succeeded" onizleme/derleme.txt

      - name: Bot oynuyor
        run: |
          timeout 2900 xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver opengl3 --audio-driver Dummy --resolution 1280x720 -- --denge=$PWD/onizleme/denge.csv --denge-son=${{ inputs.son || '60' }} > /tmp/tam.txt 2>&1 || echo "cikis kodu $?"; tail -150 /tmp/tam.txt > onizleme/denge_tam.txt; grep -E "DENGE|bölüm|Toplam" /tmp/tam.txt > onizleme/denge_kayit.txt; tail -60 /tmp/tam.txt

      - name: Depoya kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add onizleme/denge*
          git commit -m "Denge botu sonuçları" || echo "değişiklik yok"
          git pull --rebase --autostash -q
          git push
