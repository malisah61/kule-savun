name: Derleme Kontrolü ve Önizleme

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.cs"
      - "project.godot"
      - "assets/**"
      - ".github/workflows/onizleme.yml"

permissions:
  contents: write

concurrency:
  group: onizleme
  cancel-in-progress: true

jobs:
  ekran:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Godot (C#) ve sanal ekran
        run: |
          curl -sSL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip -o g.zip
          unzip -q g.zip -d /opt && rm g.zip
          ln -s /opt/Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64 /usr/local/bin/godot || sudo ln -s /opt/Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libxi6 libxrandr2 libxcursor1 libxinerama1 > /dev/null

      - name: İçe aktar ve C# derle
        run: |
          mkdir -p onizleme
          godot --headless --path . --editor --quit > /dev/null 2>&1 || true
          dotnet build KuleSavun.csproj 2>&1 | tee onizleme/derleme.txt | tail -30
          grep -q "Build succeeded" onizleme/derleme.txt

      - name: Ekran görüntüleri
        run: |
          timeout 150 xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver opengl3 --audio-driver Dummy --resolution 1280x720 -- --onizleme=onizleme 2>&1 | grep -vE "^\s*$" | tee onizleme/calisma.txt | tail -40
          ls -la onizleme

      - name: Depoya kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add onizleme
          git commit -m "Derleme kaydı ve önizleme görüntüleri" || echo "değişiklik yok"
          git pull --rebase -q
          git push
