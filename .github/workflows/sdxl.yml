name: SDXL piksel karakter uret
on:
  push:
    branches: [spritecook-indir]
    paths: ['sdxl/prompts.txt', 'sdxl/uret.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Disk aç
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sdxl-pixel-v1
      - name: Kütüphaneler
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate peft safetensors
      - name: Üret
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          python sdxl/uret.py
