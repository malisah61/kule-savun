name: Yurume kareleri (iskelet bukme + EbSynth)
# Yeni sprite üretilince (gece görevi) kendiliğinden çalışır; sadece karesi olmayan
# insan biçimli düşmanları işler ve kareleri main dalına assets/td/yuru_<id>.png olarak yazar.
on:
  workflow_run:
    workflows: ["Sanat uretimi (230 gorsel)"]
    types: [completed]
  push:
    branches: [sanat-uretimi]
    paths: ['araclar/yurume2.py', 'araclar/hareket.py', '.github/workflows/yurume.yml']
  workflow_dispatch:
    inputs:
      yeniden:
        description: "1 = hepsini baştan üret"
        default: "0"
permissions:
  contents: write
concurrency:
  group: yurume
  cancel-in-progress: false
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sanat-uretimi
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: EbSynth derle
        run: |
          git clone -q --depth 1 https://github.com/jamriska/ebsynth.git
          cd ebsynth && sh build-linux-cpu_only.sh
      - run: pip install -q opencv-python-headless scipy pillow numpy
      - name: Uret
        env:
          YENIDEN: ${{ github.event.inputs.yeniden }}
        run: |
          python araclar/yurume2.py
          python araclar/hareket.py
      - name: Sanat dalina kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add anim2 hareket.json
          git commit -qm "Yürüme kareleri" || echo yok
          git pull -q --rebase origin sanat-uretimi && git push origin HEAD:sanat-uretimi
      - name: Oyuna kopyala (main)
        run: |
          git fetch -q origin main
          git worktree add -q ../ana origin/main
          for f in anim2/E/d_*.png; do b=$(basename "$f" .png); cp "$f" "../ana/assets/td/yuru_${b#d_}.png"; done
          cp hareket.json ../ana/assets/td/hareket.json
          cd ../ana
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/td/yuru_*.png assets/td/hareket.json
          git commit -qm "Yürüme kareleri ve hareket tipleri güncellendi" || { echo degisiklik yok; exit 0; }
          git pull -q --rebase origin main && git push origin HEAD:main
