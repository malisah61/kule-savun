name: Yurume kareleri (SD + ControlNet + EbSynth)
on:
  push:
    branches: [sanat-uretimi]
    paths: ['araclar/yurume.py', 'tasarim/yurume_liste.txt', '.github/workflows/yurume.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yurume
  cancel-in-progress: true
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sd15-openpose-v1
      - name: EbSynth derle
        run: |
          git clone -q --depth 1 https://github.com/jamriska/ebsynth.git
          cd ebsynth && sh build-linux-cpu_only.sh && ls -la bin
      - name: Paketler
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate peft safetensors opencv-python-headless scipy pillow numpy
      - name: Uret
        run: python araclar/yurume.py $(grep -v '^#' tasarim/yurume_liste.txt | xargs)
      - name: Kaydet
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git pull -q --rebase origin sanat-uretimi || true
          git add anim
          git commit -qm "Yürüme kareleri (deneme)" || echo yok
          git push
